name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build .app bundle
        run: make bundle

      - name: Create DMG
        run: |
          mkdir -p dmg_staging
          cp -r ServiceLLM.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "ServiceLLM" -srcfolder dmg_staging -ov -format UDZO ServiceLLM.dmg
          rm -rf dmg_staging

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ServiceLLM.dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Legt das Release an, oder haengt die Dateien an ein bestehendes.
          #
          # Vorher brach der Schritt mit "a release with the same tag name already
          # exists" ab, sobald das Release schon auf anderem Weg entstanden war. Das
          # Ergebnis war ein Release ohne Downloads und ein roter Lauf, obwohl der
          # Build erfolgreich war.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" ServiceLLM.dmg --clobber
          else
            gh release create "${{ github.ref_name }}" ServiceLLM.dmg --repo ${{ github.repository }} --title "ServiceLLM ${{ github.ref_name }}" --notes "See CHANGELOG.md for details. Not code-signed/notarized: macOS Gatekeeper will show a warning on first run (right-click → Open)."
          fi
