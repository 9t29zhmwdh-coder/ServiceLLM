name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build .app bundle
        run: make bundle

      - name: Create DMG
        run: |
          mkdir -p dmg_staging
          cp -r ServiceLLM.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "ServiceLLM" -srcfolder dmg_staging -ov -format UDZO ServiceLLM.dmg
          rm -rf dmg_staging

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ServiceLLM.dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" ServiceLLM.dmg \
            --repo ${{ github.repository }} \
            --title "ServiceLLM ${{ github.ref_name }}" \
            --notes "See CHANGELOG.md for details. Not code-signed/notarized: macOS Gatekeeper will show a warning on first run (right-click → Open)."
